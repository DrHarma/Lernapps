name: Unterrichts-Apps veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: App-Liste erzeugen
        run: python scripts/build_index.py
      - uses: actions/configure-pages@v5
      - name: Website vorbereiten
        run: |
          mkdir -p _site
          cp index.html apps.js _site/
          touch _site/.nojekyll
          for dir in chemie biologie molab sonstige-apps; do
            if [ -d "$dir" ]; then cp -R "$dir" _site/; fi
          done
          find _site -name .gitkeep -delete
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
