<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unterrichts-Apps</title>
<style>:root{font-family:system-ui,sans-serif;color:#182b40;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:1100px;margin:auto;padding:24px}header{padding-top:45px}h1{margin:0 0 12px}p{line-height:1.6}.filter{display:flex;gap:16px;flex-wrap:wrap;background:white;padding:20px;border-radius:12px}label{display:grid;gap:6px;flex:1;min-width:180px}input,select{font:inherit;padding:12px;border:1px solid #728397;border-radius:6px;width:100%}section{margin-top:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:white;padding:20px;border:1px solid #d6e0eb;border-radius:12px}.card h3{margin-top:0}a{color:#0759a0}a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b34d00;outline-offset:4px}.meta{color:#496075}.empty{background:#e8edf3;padding:18px;border-radius:8px}footer{color:#496075}button{font:inherit;padding:10px}#status{min-height:1.5em}</style></head>
<body><header><h1>Unterrichts-Apps</h1><p>Interaktive Materialien für Chemie, Biologie, MoLab und weitere Unterrichtsfächer.</p></header>
<main><div class="filter"><label>Apps durchsuchen<input type="search" id="search" placeholder="Titel oder Thema"></label><label>Bereich<select id="subject"><option value="">Alle Bereiche</option><option>Chemie</option><option>Biologie</option><option>MoLab</option><option>Sonstige Apps</option></select></label><label>Jahrgang<select id="year"><option value="">Alle Jahrgänge</option></select></label></div><p id="status" role="status" aria-live="polite"></p><div id="content"></div><noscript><p>Bitte JavaScript aktivieren, um die automatisch erzeugte App-Übersicht zu verwenden. Die App-Dateien können auch direkt über ihren Dateipfad geöffnet werden.</p></noscript></main>
<footer>Keine Anmeldung und kein eingebautes Tracking. Bitte keine personenbezogenen Schülerdaten veröffentlichen.</footer>
<script src="apps.js"></script><script>
'use strict';
const apps=window.UNTERRICHTS_APPS||[];
const groups=['Chemie','Biologie','MoLab','Sonstige Apps'];
const years=['05','06','07','08','09','10','EP','Q1','Q2'];
const search=document.querySelector('#search'),subject=document.querySelector('#subject'),year=document.querySelector('#year');
for(const y of years){const o=document.createElement('option');o.value=y;o.textContent=y;year.append(o)}
function el(tag,text,cls){const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n}
function render(){const term=search.value.trim().toLocaleLowerCase('de');const shown=apps.filter(a=>(!subject.value||a.subject===subject.value)&&(!year.value||a.year===year.value)&&[a.title,a.description,a.year].join(' ').toLocaleLowerCase('de').includes(term));const out=document.querySelector('#content');out.replaceChildren();document.querySelector('#status').textContent=shown.length+' App(s) gefunden.';
for(const g of groups){if(subject.value&&subject.value!==g)continue;const s=el('section');s.append(el('h2',g));const entries=shown.filter(a=>a.subject===g);if(!entries.length){s.append(el('p',apps.some(a=>a.subject===g)?'Keine Apps für diese Auswahl.':'Noch keine Apps vorhanden.','empty'))}else{const grid=el('div',null,'grid');for(const a of entries){const card=el('article',null,'card');const h=el('h3');const link=el('a',a.title);link.href=a.path;h.append(link);card.append(h,el('p',a.year?'Jahrgang '+a.year:'Jahrgangsübergreifend','meta'),el('p',a.description||'Interaktive Unterrichts-App.'));grid.append(card)}s.append(grid)}out.append(s)}}
for(const input of [search,subject,year])input.addEventListener('input',render);render();
</script></body></html>
