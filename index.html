<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unterrichts-Apps</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#192d42;font-family:system-ui,sans-serif}header,main,footer{max-width:1100px;margin:auto;padding:24px}header{padding-top:38px}h1{margin:0 0 12px}p{line-height:1.6}.filters{display:flex;flex-wrap:wrap;gap:18px;background:white;padding:22px;border-radius:14px}label{display:grid;gap:8px;flex:1;min-width:180px}input,select,button{font:inherit;padding:11px;border:1px solid #8190a1;border-radius:6px}input,select{width:100%}.subject{margin-top:26px;border:1px solid #cbd6e2;background:white;border-radius:12px;overflow:hidden}summary{cursor:pointer;padding:18px;font-weight:650}summary:hover{background:#edf3fa}summary:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #aa4c00;outline-offset:-3px}.count{font-weight:400;color:#52677e;font-size:.9em;margin-left:8px}.inside{padding:0 18px 18px}.year{border:1px solid #d7e0e9;border-radius:8px;margin-top:12px}.year summary{padding:14px}.cards{padding:0 14px 14px;display:grid;gap:12px}.card{border:1px solid #dce4ed;background:#f8fafd;border-radius:8px;padding:18px}.card h3{margin:0 0 10px;font-size:1.1rem}.card p{margin:6px 0}a{color:#075c9b}.empty{color:#52677e;padding:0 14px}.tools{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}button{background:white;cursor:pointer}footer{color:#52677e;font-size:.9em}
</style></head><body><header><h1>Unterrichts-Apps</h1><p>Materialien nach Fach und Jahrgang. Öffne zuerst einen Fachordner und danach einen Jahrgang.</p></header>
<main><div class="filters"><label>Apps durchsuchen<input id="search" type="search" placeholder="Titel oder Thema"></label><label>Bereich<select id="subject"><option value="">Alle Bereiche</option><option>Chemie</option><option>Biologie</option><option>MoLab</option><option>Sonstige Apps</option></select></label><label>Jahrgang<select id="year"><option value="">Alle Jahrgänge</option></select></label></div><div class="tools"><button id="open" type="button">Alle Ordner öffnen</button><button id="close" type="button">Alle Ordner schließen</button></div><p id="status" role="status" aria-live="polite"></p><div id="content"></div><noscript>Bitte JavaScript aktivieren, um die Ordnerübersicht zu verwenden.</noscript></main><footer>Keine Anmeldung und kein eingebautes Tracking. Keine personenbezogenen Schülerdaten veröffentlichen.</footer>
<script src="apps.js"></script><script>
'use strict';
const apps=Array.isArray(window.UNTERRICHTS_APPS)?window.UNTERRICHTS_APPS:[];
const structure={'Chemie':['07','08','09','10','EP','Q1','Q2'],'Biologie':['05','06','07','08','09','10','EP','Q1','Q2'],'MoLab':[],'Sonstige Apps':[]};
const search=document.querySelector('#search'),subject=document.querySelector('#subject'),year=document.querySelector('#year'),out=document.querySelector('#content');
for(const y of ['05','06','07','08','09','10','EP','Q1','Q2']){const o=document.createElement('option');o.value=y;o.textContent=y;year.append(o)}
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined&&text!==null)n.textContent=text;if(cls)n.className=cls;return n}
function folder(label,count,cls,open){const d=el('details',null,cls);d.open=open;const s=el('summary',label);s.append(el('span','('+count+' App'+(count===1?'':'s')+')','count'));d.append(s);return d}
function cards(entries){const box=el('div',null,'cards');for(const a of entries){const card=el('article',null,'card'),h=el('h3'),link=el('a',a.title||'Unterrichts-App');link.href=a.path;h.append(link);card.append(h,el('p',a.description||'Interaktive Unterrichts-App.'));box.append(card)}return box}
function render(){const term=search.value.trim().toLocaleLowerCase('de');const active=!!(term||subject.value||year.value);const visible=apps.filter(a=>(!subject.value||a.subject===subject.value)&&(!year.value||String(a.year||'').toUpperCase()===year.value)&&[a.title,a.description,a.year].join(' ').toLocaleLowerCase('de').includes(term));out.replaceChildren();document.querySelector('#status').textContent=visible.length+' App(s) gefunden. Die Apps liegen in den Fach- und Jahrgangsordnern.';
for(const [name,years] of Object.entries(structure)){if(subject.value&&subject.value!==name)continue;const entries=visible.filter(a=>a.subject===name);if((term||year.value)&&!entries.length)continue;const section=folder(name,entries.length,'subject',active);const inside=el('div',null,'inside');if(years.length){const allYears=[...years,...new Set(entries.map(a=>String(a.year||'').toUpperCase()).filter(y=>y&&!years.includes(y)))];for(const y of allYears){if(year.value&&y!==year.value)continue;const list=entries.filter(a=>String(a.year||'').toUpperCase()===y);if(term&&!list.length)continue;const d=folder('Jahrgang '+y,list.length,'year',active&&list.length>0);if(list.length)d.append(cards(list));else d.append(el('p','Noch keine Apps in diesem Jahrgang.','empty'));inside.append(d)}const unassigned=entries.filter(a=>!a.year);if(unassigned.length){const d=folder('Ohne Jahrgang',unassigned.length,'year',active);d.append(cards(unassigned));inside.append(d)}}else{if(entries.length)inside.append(cards(entries));else inside.append(el('p','Noch keine Apps vorhanden.','empty'))}section.append(inside);out.append(section)}}
for(const field of [search,subject,year])field.addEventListener('input',render);
document.querySelector('#open').addEventListener('click',()=>out.querySelectorAll('details').forEach(d=>d.open=true));
document.querySelector('#close').addEventListener('click',()=>out.querySelectorAll('details').forEach(d=>d.open=false));render();
</script></body></html>
